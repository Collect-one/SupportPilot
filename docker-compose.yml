services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: support_pilot
      POSTGRES_USER: support_pilot
      POSTGRES_PASSWORD: support_pilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_pilot -d support_pilot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://support_pilot:support_pilot@db:5432/support_pilot
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ENVIRONMENT: development
      DEMO_MODE: "true"
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO: "true"
      UPLOAD_DIR: /data/uploads
      DEMO_KNOWLEDGE_DIR: /app/docs/demo-knowledge
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 60

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker
    environment:
      <<: *app_environment
      SEED_DEMO: "false"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads_data:
